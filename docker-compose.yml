
services:
  postgres:
    image: postgres:16      # versiyon senin tercihin, 16 önerim
    environment:
      POSTGRES_USER: ${POSTGRES_USER}     # kendi seçeceğin bir kullanıcı adı, örn: kolektif_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # kendi seçeceğin bir şifre (şimdilik basit tutabilirsin, geliştirme ortamı)
      POSTGRES_DB: ${POSTGRES_DB}       # veritabanı adı, örn: kolektif_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: